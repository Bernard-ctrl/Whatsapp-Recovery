name: Build and publish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # Prevent Gradle's file watcher/daemon from colliding with Flutter's
      # generated Android build during CI.
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Gradle wrapper if needed
        working-directory: android
        run: |
          if [ ! -x ./gradlew ]; then
            gradle_zip="$RUNNER_TEMP/gradle-8.14-bin.zip"
            gradle_dir="$RUNNER_TEMP/gradle-8.14"
            curl --fail --silent --show-error --location \
              https://services.gradle.org/distributions/gradle-8.14-bin.zip \
              --output "$gradle_zip"
            unzip -q "$gradle_zip" -d "$RUNNER_TEMP"
            "$gradle_dir/bin/gradle" wrapper --gradle-version 8.14
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          previous_tag=$(git tag --sort=-creatordate | head -n 1 || true)
          if [ -n "$previous_tag" ]; then
            notes=$(git log --pretty=format:'- `%h` %s' "$previous_tag..$GITHUB_SHA")
          else
            notes=$(git log --pretty=format:'- `%h` %s' "$GITHUB_SHA")
          fi
          if [ -z "$notes" ]; then
            notes="- No commit changes since the previous release."
          fi
          release_notes=$(printf '## Commits\n\n%s' "$notes")
          gh release create "$tag" \
            build/app/outputs/flutter-apk/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "APK build ${GITHUB_RUN_NUMBER}" \
            --notes "$release_notes"
